<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tasklert" />
    <link rel="icon" type="image/svg+xml" href="/tasklert-icon.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/tasklert-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8B2CF5" />
    <meta name="description" content="Smart task reminders, exact-time alarms, and real-time multi-device notifications." />
    <title>Tasklert - Task &amp; Reminder Workspace</title>
    <script>
      // Register Tasklert Service Worker for PWA and Web Push
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('Tasklert Service Worker registered:', reg.scope);
              reg.onupdatefound = function() {
                var installing = reg.installing;
                if (installing) {
                  installing.onstatechange = function() {
                    if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New Tasklert version installed and ready.');
                    }
                  };
                }
              };
            })
            .catch(function(err) {
              console.warn('Service Worker registration failed:', err);
            });
        });
      }

    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
